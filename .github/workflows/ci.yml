name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-rust:
    name: Rust Solver Tests (biotransport-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust crate
        run: |
          cd 02_continuum_transport/biotransport-rs
          cargo build --verbose

      - name: Run Rust unit and integration tests
        run: |
          cd 02_continuum_transport/biotransport-rs
          cargo test --verbose -- --nocapture

  test-python:
    name: Python Continuum Bridge & Multiscale Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python test suite
        run: |
          export PYTHONPATH="02_continuum_transport/python:01_microscale_md/scripts:$PYTHONPATH"
          pytest 01_microscale_md/tests 02_continuum_transport/python/tests -v

      - name: Test CLI execution and figure generation
        run: |
          export PYTHONPATH="02_continuum_transport/python:$PYTHONPATH"
          python 02_continuum_transport/python/biotransport/cli.py --params data/sample_md_params.json --plot data/ci_test_plot.png

      - name: Test Master 15-Module Pipeline Execution
        run: |
          export PYTHONPATH="02_continuum_transport/python:01_microscale_md/scripts:$PYTHONPATH"
          python scripts/master_run_pipeline.py
